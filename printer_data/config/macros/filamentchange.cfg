
# ============================================
# FILAMENT CHANGE - ABS / ASA
# ============================================

[gcode_macro FILAMENT_UNLOAD]
description: ABS/ASA unload - heat, cool and retract 150 mm
gcode:
    {% set heater = printer.toolhead.extruder %}
    {% set temp = params.TEMP|default(180)|float %}
    {% set heat_temp = params.HEAT_TEMP|default(250)|float %}
    {% set cfg = printer.configfile.settings[heater] %}

    {% if printer.print_stats.state == 'printing' %}
        { action_raise_error('Pause the print before changing filament.') }
    {% endif %}
    {% if temp < cfg.min_extrude_temp or temp > 240 %}
        { action_raise_error('Invalid unload temperature.') }
    {% endif %}
    {% if heat_temp < temp or heat_temp >= cfg.max_temp %}
        { action_raise_error('Invalid heating temperature.') }
    {% endif %}

    SAVE_GCODE_STATE NAME=filament_unload_state
    M83
    M221 S100

    # Heat and soften filament
    SET_HEATER_TEMPERATURE HEATER={heater} TARGET={heat_temp}
    TEMPERATURE_WAIT SENSOR={heater} MINIMUM={heat_temp - 2} MAXIMUM={heat_temp + 2}

    G1 E3 F180
    M400

    # Cool before retracting
    SET_HEATER_TEMPERATURE HEATER={heater} TARGET={temp + 1}
    TEMPERATURE_WAIT SENSOR={heater} MINIMUM={temp} MAXIMUM={temp + 2}

    # Retract 150 mm
    G1 E-50 F1200
    G1 E-50 F1200
    G1 E-50 F1200
    M400

    # Standby temperature
    SET_HEATER_TEMPERATURE HEATER={heater} TARGET=150
    RESTORE_GCODE_STATE NAME=filament_unload_state


[gcode_macro FILAMENT_LOAD]
description: ABS/ASA load - heat and feed 150 mm
gcode:
    {% set heater = printer.toolhead.extruder %}
    {% set heat_temp = params.TEMP|default(250)|float %}
    {% set cfg = printer.configfile.settings[heater] %}

    {% if printer.print_stats.state == 'printing' %}
        { action_raise_error('Pause the print before changing filament.') }
    {% endif %}
    {% if heat_temp < cfg.min_extrude_temp or heat_temp >= cfg.max_temp %}
        { action_raise_error('Invalid loading temperature.') }
    {% endif %}

    SAVE_GCODE_STATE NAME=filament_load_state
    M83
    M221 S100

    # Heat hotend
    SET_HEATER_TEMPERATURE HEATER={heater} TARGET={heat_temp}
    TEMPERATURE_WAIT SENSOR={heater} MINIMUM={heat_temp - 2} MAXIMUM={heat_temp + 2}

    # Load 150 mm
    G1 E50 F1200
    G1 E50 F1200
    G1 E40 F600
    G1 E10 F180
    M400

    # Standby temperature
    SET_HEATER_TEMPERATURE HEATER={heater} TARGET=150
    RESTORE_GCODE_STATE NAME=filament_load_state
