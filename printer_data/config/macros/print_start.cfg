[gcode_macro PRINT_START]
description: "Initialize toolchanger, home, QGL, adaptive mesh, and prepare for printing"
gcode:
    {% set TOOL = params.TOOL | default(0) | int %}
    {% set TOOL_TEMP = params.TOOL_TEMP | default(220) | float %}
    {% set BED_TEMP = params.BED_TEMP | default(60) | float %}
    {% set STANDBY_TEMP = params.STANDBY_TEMP | default(150) | float %}

    # Initialize toolchanger
    INITIALIZE_TOOLCHANGER

    # Disable crash detection during startup
    STOP_TOOL_PROBE_CRASH_DETECTION

    # Start heating bed
    M140 S{BED_TEMP}

    # Home
    G28

    # Use T0 for probing / QGL / mesh
    T0

    # Heat T0 to probing temperature
    M109 S150

    # Wait for bed
    M190 S{BED_TEMP}

    # Level gantry
    QUAD_GANTRY_LEVEL

    # Re-home Z after QGL
    G28 Z

    # Clear old mesh
    BED_MESH_CLEAR

    # Generate adaptive mesh for current print area
    BED_MESH_CALIBRATE ADAPTIVE=1

    # Put all used tools at standby temperature
    {% for tool_nr in printer.toolchanger.tool_numbers %}
        {% set temp_param = 'T' ~ tool_nr|string ~ '_TEMP' %}
        {% if temp_param in params %}
            M104 T{tool_nr} S{STANDBY_TEMP}
        {% endif %}
    {% endfor %}

    # Select initial printing tool
    T{TOOL}

    # Heat ONLY initial tool to print temperature
    M109 S{TOOL_TEMP}

    # Purge with the selected initial tool
    SQUIGGLY_PURGE

    # Re-enable crash detection
    START_TOOL_PROBE_CRASH_DETECTION