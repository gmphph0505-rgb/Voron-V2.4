[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /home/biqu/printer_data/comms/klippy.sock

[file_manager]
config_path: /home/biqu/printer_data/config
log_path: /home/biqu/printer_data/logs

[authorization]
trusted_clients:
    127.0.0.1
    192.168.0.0/16
cors_domains:
    *.local
    *.lan
    *://localhost
    *://localhost:*
    *://192.168.1.69
    *://192.168.1.69:*

[octoprint_compat]

[history]

[update_manager]
channel: dev
refresh_interval: 168



[include octoeverywhere-system.cfg]

# Crowsnest update_manager entry
[update_manager crowsnest]
type: git_repo
path: ~/crowsnest
origin: https://github.com/mainsail-crew/crowsnest.git
managed_services: crowsnest
install_script: tools/pkglist.sh


[update_manager axiscope]
type: git_repo
path: /home/biqu/axiscope
origin: https://github.com/nic335/Axiscope.git
primary_branch: main
is_system_service: True
managed_services: axiscope

[update_manager klipper-toolchanger-easy]
type: git_repo
path: ~/klipper-toolchanger-easy
origin: https://github.com/jwellman80/klipper-toolchanger-easy.git
managed_services: klipper
primary_branch: main
[update_manager klipper-backup]
type: git_repo
path: ~/klipper-backup
origin: https://github.com/Staubgeborener/klipper-backup.git
managed_services: moonraker
primary_branch: main