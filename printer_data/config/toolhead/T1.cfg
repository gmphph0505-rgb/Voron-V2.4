[mcu t1]
#canbus_uuid: 543b04b0d27e
canbus_uuid: 0dde05c5bbff


# =========================
# EXTRUDER
# =========================

[extruder1]
step_pin: t1:PD0
dir_pin: !t1:PD1
enable_pin: !t1:PD2
max_extrude_cross_section: 2.0

microsteps: 16
rotation_distance: 21.77179
gear_ratio: 50:10

nozzle_diameter: 0.400
filament_diameter: 1.750

heater_pin: t1:PB13
sensor_type: Generic 3950
sensor_pin: t1:PA3

control: pid
pid_Kp: 30
pid_Ki: 10
pid_Kd: 26.570

min_temp: 10
max_temp: 300
min_extrude_temp: 170

pressure_advance: 0.035
pressure_advance_smooth_time: 0.040




[tmc2209 extruder1]
uart_pin: t1:PA15
interpolate: false
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0


# =========================
# FANS
# =========================

[fan_generic T1_partfan]
pin: t1:PA0
kick_start_time: 0.5
off_below: 0.10


[heater_fan T1_hotend_fan]
pin: t1:PA1
max_power: 1.0
kick_start_time: 0.5
heater: extruder1
heater_temp: 50.0




# =========================
# ACCELEROMETER
# =========================

[adxl345 t1]
cs_pin: t1:PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z


# =========================
# TOOL
# =========================

[gcode_macro T1]
variable_active: 0
variable_color: ""
gcode:
    SELECT_TOOL T=1


[tool T1]
tool_number: 1
extruder: extruder1
fan: T1_partfan




####################################################################
[tool T1]
tool_number: 1
extruder: extruder1
fan: T1_partfan

gcode_x_offset: -1.3
gcode_y_offset: -0.600
gcode_z_offset: 1.75
####################################################################




# Tillfälliga dockvärden från exempelconfig
# Kalibreras senare mot din faktiska dockposition
params_park_x: 324.2
params_park_y: -1.4
params_park_z: 281


# Tillfälliga Input Shaper-värden
# Kalibreras separat med T1 monterad
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 52
params_input_shaper_damping_ratio_x: 0.098

params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 37.2
params_input_shaper_damping_ratio_y: 0.088


# =========================
# OPTOTAP / TOOL PROBE
# =========================

[tool_probe T1]
pin: ^t1:PB6
tool: 1

x_offset: 0.170
y_offset: -4.340
z_offset: 1.849


speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 4.0
samples_tolerance: 0.0075
samples_tolerance_retries: 5

activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder1 TEMP=150