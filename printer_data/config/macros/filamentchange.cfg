[gcode_macro FILAMENT_BYTE]
description: ABS/ASA unload: soften, cool to TEMP (default 180 C), retract 150 mm
gcode:
    {% set heater = printer.toolhead.extruder %}
    {% set temp = params.TEMP|default(180)|float %}
    {% set heat_temp = params.HEAT_TEMP|default(250)|float %}
    {% set cfg = printer.configfile.settings[heater] %}
    {% if printer.print_stats.state == 'printing' %}
        { action_raise_error('Pause the print before changing filament.') }
    {% endif %}
    {% if temp < cfg.min_extrude_temp or temp > 240 %}
        { action_raise_error('TEMP must be between min_extrude_temp and 240 C.') }
    {% endif %}
    {% if heat_temp < temp or heat_temp >= cfg.max_temp %}
        { action_raise_error('HEAT_TEMP must be >= TEMP and below the hotend max_temp.') }
    {% endif %}

    SAVE_GCODE_STATE NAME=filament_byte_state
    M83
    M221 S100

    # Use the active extruder directly, independent of toolchanger initialization.
    SET_HEATER_TEMPERATURE HEATER={heater} TARGET={heat_temp}
    TEMPERATURE_WAIT SENSOR={heater} MINIMUM={heat_temp - 2} MAXIMUM={heat_temp + 2}
    G1 E3 F180
    M400

    # Cool before pulling the softened filament out of the melt zone.
    SET_HEATER_TEMPERATURE HEATER={heater} TARGET={temp + 1}
    TEMPERATURE_WAIT SENSOR={heater} MINIMUM={temp} MAXIMUM={temp + 2}
    G1 E-50 F1200
    G1 E-50 F1200
    G1 E-50 F1200
    M400
    SET_HEATER_TEMPERATURE HEATER={heater} TARGET=0
    RESTORE_GCODE_STATE NAME=filament_byte_state
