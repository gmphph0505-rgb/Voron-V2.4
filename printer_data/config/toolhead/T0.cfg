[mcu t0]
#canbus_uuid: 543b04b0d27e
canbus_uuid: 0dde05c5bbff


[temperature_sensor EBB36_T0]
sensor_type: temperature_mcu
sensor_mcu: t0


# =========================
# EXTRUDER
# =========================

[extruder]
step_pin: t0:PD0
dir_pin: t0:PD1
enable_pin: !t0:PD2
max_extrude_cross_section: 2.0

microsteps: 16
rotation_distance: 21.77179
gear_ratio: 50:10

nozzle_diameter: 0.400
filament_diameter: 1.750

heater_pin: t0:PB13
sensor_type: Generic 3950
sensor_pin: t0:PA3

control: pid
pid_Kp: 31.126
pid_Ki: 12.969
pid_Kd: 18.675

min_temp: 10
max_temp: 300
min_extrude_temp: 170

pressure_advance: 0.035
pressure_advance_smooth_time: 0.040


[tmc2209 extruder]
uart_pin: t0:PA15
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


# =========================
# FANS
# =========================

[fan_generic T0_partfan]
pin: t0:PA0
kick_start_time: 0.5
off_below: 0.10


[heater_fan T0_hotend_fan]
pin: t0:PA1
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0




# =========================
# ACCELEROMETER
# =========================

[adxl345 t0]
cs_pin: t0:PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z


# =========================
# TOOL
# =========================

[gcode_macro T0]
variable_active: 0
variable_color: ""
gcode:
    SELECT_TOOL T=1


[tool T0]
tool_number: 1
extruder: extruder
fan: T0_partfan

[input_shaper]
shaper_type_x: 2hump_ei
shaper_freq_x: 82.8
shaper_type_y: ei
shaper_freq_y: 39.4



####################################################################
[tool T0]
tool_number: 1
extruder: extruder
fan: T0_partfan

####################################################################



