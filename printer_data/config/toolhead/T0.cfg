[mcu t0]
#canbus_uuid: 0dde05c5bbff
canbus_uuid: 543b04b0d27e

# =========================
# EXTRUDER
# =========================
[extruder]
step_pin: t0:PD0
dir_pin: t0:PD1
enable_pin: !t0:PD2

microsteps: 16
rotation_distance: 21.77179
gear_ratio: 50:10
max_extrude_cross_section: 2.0

nozzle_diameter: 0.600
filament_diameter: 1.750

heater_pin: t0:PB13
sensor_type: Generic 3950
sensor_pin: t0:PA3

min_temp: 10
max_temp: 275
min_extrude_temp: 170

pressure_advance: 0.035
pressure_advance_smooth_time: 0.040


[tmc2209 extruder]
uart_pin: t0:PA15
interpolate: false
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0


# =========================
# FANS
# =========================
[fan_generic T0_partfan]
pin: t0:PA0
kick_start_time: 0.5
off_below: 0.10


[heater_fan T0_hotend_fan]
pin: t0:PA1
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
fan_speed: 0.8


# =========================
# ACCELEROMETER
# =========================
[adxl345]
cs_pin: t0:PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z


[resonance_tester]
accel_chip: adxl345
probe_points:
    175, 175, 20
max_freq: 124

[input_shaper]
shaper_type_x: 2hump_ei
shaper_freq_x: 82.8
shaper_type_y: ei
shaper_freq_y: 39.4

# =========================
# KTC TOOL
# =========================
[gcode_macro T0]
variable_active: 0
variable_color: ""
gcode:
    SELECT_TOOL T=0


[tool T0]
tool_number: 0
extruder: extruder
fan: T0_partfan

gcode_z_offset: 1.85

# ÄNDRA DESSA till T0:s faktiska dockposition
params_park_x: 26
params_park_y: -1.5
params_park_z: 281.406
# Kan kalibreras senare
params_input_shaper_type_x: '2hump_ei'
params_input_shaper_freq_x: 84.6
params_input_shaper_damping_ratio_x: 0.098

params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 38.0
params_input_shaper_damping_ratio_y: 0.088




# =========================
# OPTOTAP / TOOL PROBE
# =========================

[tool_probe T0]
pin: ^t0:PB6
tool: 0

x_offset: 0
y_offset: 0

# Börja säkert här och kalibrera senare
z_offset: 1.467

speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 4.0
samples_tolerance: 0.0075
samples_tolerance_retries: 10

activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder TEMP=150

    PID parameters: pid_Kp=45.558 pid_Ki=15.186 pid_Kd=34.169