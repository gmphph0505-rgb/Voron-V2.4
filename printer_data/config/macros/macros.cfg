# Plats: printer.cfg (eller din separata makro-fil)

[gcode_macro G32]
description: Rensar bed mesh, homar, kör QGL och homar Z igen.
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90                   # Absolut positionering
    BED_MESH_CLEAR        # Rensa eventuell inläst bed mesh innan QGL
    
    # 1. Homa alla axlar om de inte redan är homade
    {% if not 'xyz' in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    
    # 2. Utför Quad Gantry Level (QGL)
    QUAD_GANTRY_LEVEL
    
    # 3. Homa Z igen (viktigt! Z-höjden kan ha ändrats efter att gantryt rätats upp)
    G28 Z
    
    # Valfritt: Parkera verktygshuvudet i mitten (exempel för 350mm)
    # G0 X175 Y175 Z30 F3600
    
    RESTORE_GCODE_STATE NAME=STATE_G32