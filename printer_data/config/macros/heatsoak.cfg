[gcode_macro WARMUP_CHAMBER]
description: Värmer bädd (110) och nozzle (150) utan att låsa UI. Homar och parkerar i mitten.
gcode:
    # 1. Sätt temperaturer utan att vänta (non-blocking)
    M140 S110      ; Sätt bäddtemperatur till 110 grader
    M104 S150      ; Sätt nozzletemperatur till 150 grader
    
    # 2. Homa maskinen
    # En säkerhetskontroll: Homar bara om axlarna inte redan är homade
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    
    # 3. Använd absolut positionering
    G90            
    
    # 4. Flytta verktygshuvudet till mitten (175, 175) och 10 cm (100 mm) över bädden
    # F6000 ger en hastighet på 100 mm/s.
    G0 X175 Y175 Z100 F6000
    
    # 5. Starta part cooling-fläkten på 100% för att cirkulera luften i kammaren
    M106 S255