# =========================
# OPTOTAP / TOOL PROBE
# =========================

[tool_probe T0]
pin: ^t0:PB6
tool: 1

x_offset: 0
y_offset: 0
z_offset: -0.409


speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 4.0
samples_tolerance: 0.0075
samples_tolerance_retries: 5

activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder TEMP=150